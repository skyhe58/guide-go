# Go 知识库 — 自动构建 + 部署工作流
# 触发条件：推送到 main 分支
# 步骤：Go 编译验证 → VitePress 构建 → 部署到 GitHub Pages

name: 构建并部署知识库

on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

# 设置 GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务运行
concurrency:
  group: pages
  cancel-in-progress: false

# 让使用 Node.js 20 的 Actions 提前运行于 Node.js 24
# 参考：https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================
  # 任务 1：Go 代码编译验证
  # ============================================================
  go-build:
    name: Go 编译验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: code-examples/**/go.sum

      - name: 验证 Go 版本
        run: go version

      # 使用 Go Workspace 遍历编译所有模块
      # 说明：workspace 根目录无 go.mod，直接 `go build ./...` 会报
      # "directory prefix . does not contain modules listed in go.work"
      # 因此遍历 go.work 中每个模块的目录分别编译。
      - name: 编译所有 Go 模块
        run: |
          set -euo pipefail
          dirs=$(go list -f '{{.Dir}}' -m)
          for d in $dirs; do
            echo "::group::go build $d"
            (cd "$d" && go build ./...)
            echo "::endgroup::"
          done
        working-directory: code-examples

      # --- 可选步骤 ---

      # 可选：运行 Go 单元测试
      # - name: 运行 Go 测试
      #   run: go test ./...
      #   working-directory: code-examples

      # 可选：运行 golangci-lint 代码质量检查
      # - name: 运行 golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #   with:
      #     version: latest
      #     working-directory: code-examples

  # ============================================================
  # 任务 2：构建 VitePress 站点
  # ============================================================
  build-site:
    name: 构建 VitePress 站点
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # VitePress 需要完整 git 历史以获取最后更新时间

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install
        working-directory: docs

      - name: 构建 VitePress 站点
        run: pnpm run build
        working-directory: docs

      # 可选：Markdown 断链检查（构建日志中输出警告）
      # - name: 检查 Markdown 断链
      #   run: |
      #     npx markdown-link-check docs/**/*.md --quiet || echo "::warning::检测到 Markdown 断链，请检查构建日志"
      #   continue-on-error: true

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # ============================================================
  # 任务 3：部署到 GitHub Pages
  # ============================================================
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
