# =============================================================================
# 反向代理与负载均衡：Nginx
# 用于：code-examples/05-devops/nginx/ 模块
# 启动命令：docker compose -f docker/docker-compose.nginx.yml up -d
# 停止命令：docker compose -f docker/docker-compose.nginx.yml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx 反向代理服务器
  # 用于：反向代理 Go 服务、负载均衡、HTTPS 配置、限流防刷
  # HTTP 地址：localhost:80
  # HTTPS 地址：localhost:443
  # 配置文件挂载：将本地 nginx/conf 目录映射到容器内
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: guide-go-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载自定义 Nginx 配置（需在 code-examples/05-devops/nginx/conf/ 下准备配置文件）
      # - ../code-examples/05-devops/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ../code-examples/05-devops/nginx/conf/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# 数据卷定义
volumes:
  nginx-logs:
