# =============================================================================
# 消息队列：Kafka、NATS、RabbitMQ、EMQX
# 启动命令：docker compose -f docker/docker-compose.mq.yml up -d
# 启动单个服务：docker compose -f docker/docker-compose.mq.yml up -d kafka
# 停止命令：docker compose -f docker/docker-compose.mq.yml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Kafka 消息队列（使用 KRaft 模式，无需 ZooKeeper）
  # 用于：code-examples/02-web-data/message-queue/kafka/ 模块
  # 连接地址：localhost:9092
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: guide-go-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft 模式配置（无需 ZooKeeper）
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 监听器配置
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      # 其他配置
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # NATS 消息系统（Go 原生轻量级消息队列）
  # 用于：code-examples/02-web-data/message-queue/nats/ 模块
  # 连接地址：localhost:4222
  # 监控面板：localhost:8222
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2-alpine
    container_name: guide-go-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ 消息队列
  # 用于：code-examples/02-web-data/message-queue/rabbitmq/ 模块
  # AMQP 连接地址：localhost:5672，用户名：guest，密码：guest
  # 管理面板：localhost:15672
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: guide-go-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # EMQX MQTT Broker（物联网消息协议）
  # 用于：code-examples/02-web-data/message-queue/mqtt/ 模块
  # MQTT 连接地址：localhost:1883
  # Dashboard：localhost:18083（默认用户名：admin，密码：public）
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5
    container_name: guide-go-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# 数据卷定义
volumes:
  kafka-data:
  rabbitmq-data:
  emqx-data:
