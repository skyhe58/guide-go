# =============================================================================
# 认证鉴权：Keycloak（身份和访问管理系统）
# 用于：code-examples/02-web-data/auth/keycloak/ 模块
# 启动命令：docker compose -f docker/docker-compose.auth.yml up -d
# 停止命令：docker compose -f docker/docker-compose.auth.yml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Keycloak 身份认证与访问管理（IAM）
  # 用于：OAuth2/OpenID Connect 认证、SSO 单点登录、用户与角色管理
  # 管理控制台：localhost:8080，用户名：admin，密码：admin
  # Go 集成方式：HTTP 客户端调用 Keycloak REST API / OIDC 协议
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: guide-go-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 管理员账号配置
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    # 开发模式启动（内置 H2 数据库，无需外部数据库）
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
