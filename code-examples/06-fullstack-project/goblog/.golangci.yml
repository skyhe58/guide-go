# GoBlog golangci-lint 配置
# 启用常用的代码质量检查 linter

linters:
  enable:
    - errcheck      # 检查未处理的错误返回值
    - govet         # 检查 Go 代码中的可疑构造
    - staticcheck   # 静态分析检查
    - gosimple      # 简化代码建议
    - unused        # 检查未使用的变量、函数等

run:
  timeout: 5m
  go: "1.22"

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  exclude-rules:
    # 测试文件中允许使用 dot imports
    - path: _test\.go
      linters:
        - unused
