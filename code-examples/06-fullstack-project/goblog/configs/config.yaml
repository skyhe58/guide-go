# GoBlog 默认配置文件
# 使用 Viper 加载，支持通过环境变量覆盖

server:
  port: 8080
  mode: debug
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 30s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres123
  dbname: goblog
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  log_level: warn

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "your-secret-key-change-in-production"
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  issuer: goblog

rate_limit:
  requests_per_second: 10
  burst: 20

log:
  level: debug
  format: json
  output: stdout
