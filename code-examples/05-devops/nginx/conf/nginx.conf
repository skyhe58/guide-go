# =============================================================================
# Nginx 主配置文件示例
# 适用于：Go 后端服务的生产环境 Nginx 配置
#
# 使用说明：
#   1. 将此文件放到 /etc/nginx/nginx.conf
#   2. 将 go-service.conf 等配置放到 /etc/nginx/conf.d/ 目录下
#   3. 测试配置：nginx -t
#   4. 重载配置：nginx -s reload
#
# Docker 启动：docker compose -f docker/docker-compose.nginx.yml up -d
# 最后验证：2024-12-01
# =============================================================================

# Worker 进程运行用户
user nginx;

# Worker 进程数量（auto = CPU 核心数）
worker_processes auto;

# 错误日志路径和级别
error_log /var/log/nginx/error.log warn;

# PID 文件路径
pid /var/run/nginx.pid;

# ============================================================================
# 事件模型配置
# ============================================================================
events {
    # 每个 Worker 进程的最大并发连接数
    worker_connections 4096;

    # 使用 epoll 事件模型（Linux 高性能 I/O 多路复用）
    use epoll;

    # 允许一个 Worker 同时接受多个新连接
    multi_accept on;
}

# ============================================================================
# HTTP 服务配置
# ============================================================================
http {
    # MIME 类型映射
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================================
    # 日志配置
    # ========================================================================

    # JSON 格式日志（便于 ELK/Loki 等日志系统解析）
    log_format json_log escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_log;

    # ========================================================================
    # 性能优化
    # ========================================================================

    # 开启 sendfile 零拷贝（静态文件直接从内核缓冲区发送）
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 连接超时
    keepalive_timeout 65;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # 请求体大小限制（文件上传场景需要调大）
    client_max_body_size 10m;

    # 隐藏 Nginx 版本号（安全加固）
    server_tokens off;

    # ========================================================================
    # Gzip 压缩
    # ========================================================================
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    # ========================================================================
    # 限流配置
    # ========================================================================

    # API 接口限流：每个 IP 每秒 20 个请求
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # 登录接口限流：每个 IP 每秒 2 个请求
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

    # 并发连接限制
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # 限流返回 429 状态码
    limit_req_status 429;
    limit_conn_status 429;

    # ========================================================================
    # 加载子配置文件
    # ========================================================================
    include /etc/nginx/conf.d/*.conf;
}
