# =============================================================================
# Nginx 负载均衡配置示例
# 适用于：多实例 Go 服务的负载均衡
#
# 功能：
#   - 四种负载均衡策略示例（轮询/加权/IP Hash/最少连接）
#   - 健康检查与故障转移
#   - 备用服务器配置
#
# 使用说明：
#   根据实际需求选择一种策略，取消对应注释
#
# Docker 启动：docker compose -f docker/docker-compose.nginx.yml up -d
# 最后验证：2024-12-01
# =============================================================================

# ============================================================================
# 策略 1：轮询（默认）
# 请求依次分发到各后端，适合性能相近的服务器
# ============================================================================
upstream go_app_roundrobin {
    server 127.0.0.1:8080;
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;

    # 健康检查参数
    # max_fails=3：3 次失败后标记为不可用
    # fail_timeout=30s：不可用持续 30 秒后重新尝试
    # server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;

    # 保持长连接
    keepalive 32;
}

# ============================================================================
# 策略 2：加权轮询
# 按权重分发请求，高性能服务器处理更多请求
# ============================================================================
upstream go_app_weighted {
    server 127.0.0.1:8080 weight=5;   # 8 核 16G，处理 50% 请求
    server 127.0.0.1:8081 weight=3;   # 4 核 8G，处理 30% 请求
    server 127.0.0.1:8082 weight=2;   # 2 核 4G，处理 20% 请求

    keepalive 32;
}

# ============================================================================
# 策略 3：IP Hash
# 同一客户端 IP 始终转发到同一后端（会话保持）
# 注意：Go 服务使用 JWT 无状态认证时通常不需要 IP Hash
# ============================================================================
upstream go_app_iphash {
    ip_hash;
    server 127.0.0.1:8080;
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;

    keepalive 32;
}

# ============================================================================
# 策略 4：最少连接
# 优先转发到当前连接数最少的后端
# 适合请求处理时间差异较大的场景
# ============================================================================
upstream go_app_leastconn {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;

    # 备用服务器：仅在所有主服务器不可用时启用
    server 127.0.0.1:8083 backup;

    keepalive 32;
}

# ============================================================================
# 负载均衡 Server 配置
# 选择上面的一个 upstream 使用
# ============================================================================
server {
    listen 80;
    server_name lb.example.com;

    location / {
        # 选择负载均衡策略（取消对应注释）
        proxy_pass http://go_app_roundrobin;
        # proxy_pass http://go_app_weighted;
        # proxy_pass http://go_app_iphash;
        # proxy_pass http://go_app_leastconn;

        # 传递客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 使用 HTTP/1.1 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # 故障转移：当后端返回以下错误时，自动切换到下一个后端
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;       # 最多重试 3 次
        proxy_next_upstream_timeout 10s;   # 重试总超时 10 秒
    }

    # 健康检查
    location /health {
        access_log off;
        proxy_pass http://go_app_roundrobin/health;
    }
}
