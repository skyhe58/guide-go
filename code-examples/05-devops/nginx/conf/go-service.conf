# =============================================================================
# Nginx 反向代理 Go 服务配置
# 适用于：单个 Go 后端服务的反向代理
#
# 功能：
#   - 反向代理 Go 服务（:8080）
#   - 传递客户端真实 IP
#   - WebSocket 代理支持
#   - 静态文件直接返回
#   - 健康检查端点
#   - 限流防刷
#   - 跨域配置
#
# 使用说明：
#   将此文件放到 /etc/nginx/conf.d/ 目录下
#
# Docker 启动：docker compose -f docker/docker-compose.nginx.yml up -d
# 最后验证：2024-12-01
# =============================================================================

# Go 后端服务上游
upstream go_backend {
    server 127.0.0.1:8080;

    # 保持长连接（减少 TCP 握手开销）
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name api.example.com;

    # 每个 IP 最多 100 个并发连接
    limit_conn conn 100;

    # ========================================================================
    # API 接口反向代理
    # ========================================================================
    location /api/ {
        # 限流：每秒 20 个请求，允许突发 40 个
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://go_backend;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # 使用 HTTP/1.1 保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # CORS 跨域配置
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost:3000|web\.example\.com)$") {
            set $cors_origin $http_origin;
        }

        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            return 204;
        }

        # 实际请求的 CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ========================================================================
    # 登录接口（更严格的限流）
    # ========================================================================
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================================================
    # WebSocket 代理
    # ========================================================================
    location /ws/ {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # WebSocket 长连接超时 1 小时
    }

    # ========================================================================
    # 健康检查端点（不记录日志）
    # ========================================================================
    location /health {
        access_log off;
        proxy_pass http://go_backend/health;
        proxy_set_header Host $host;
    }

    # ========================================================================
    # Prometheus 指标端点（仅内网访问）
    # ========================================================================
    location /metrics {
        # 限制只允许内网访问
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://go_backend/metrics;
    }

    # ========================================================================
    # 静态文件（直接由 Nginx 返回，不经过 Go 服务）
    # ========================================================================
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================================================
    # 自定义错误页面
    # ========================================================================
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后重试"}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 502 '{"code":502,"message":"服务暂时不可用，请稍后重试"}';
    }
}
