# =============================================================================
# Nginx HTTPS 配置示例
# 适用于：Go 服务的 HTTPS 反向代理（SSL 终止）
#
# 功能：
#   - SSL/TLS 终止（Nginx 处理 HTTPS，Go 服务使用 HTTP）
#   - HTTP 自动跳转 HTTPS
#   - HSTS 安全头
#   - 现代 TLS 配置（TLS 1.2 + 1.3）
#   - SSL 会话缓存优化
#
# 证书获取：
#   Let's Encrypt: certbot --nginx -d api.example.com
#   自签名（测试）: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#                    -keyout /etc/nginx/ssl/privkey.pem \
#                    -out /etc/nginx/ssl/fullchain.pem
#
# Docker 启动：docker compose -f docker/docker-compose.nginx.yml up -d
# 最后验证：2024-12-01
# =============================================================================

# Go 后端服务
upstream go_backend_https {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ============================================================================
# HTTP → HTTPS 自动跳转
# ============================================================================
server {
    listen 80;
    server_name api.example.com;

    # 301 永久重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# ============================================================================
# HTTPS 服务配置
# ============================================================================
server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ========================================================================
    # SSL 证书配置
    # ========================================================================

    # 证书文件路径（Let's Encrypt 默认路径）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ========================================================================
    # SSL 协议与加密套件
    # 参考 Mozilla SSL Configuration Generator（Intermediate 配置）
    # https://ssl-config.mozilla.org/
    # ========================================================================

    # 只启用 TLS 1.2 和 TLS 1.3（禁用不安全的 SSLv3、TLS 1.0、TLS 1.1）
    ssl_protocols TLSv1.2 TLSv1.3;

    # 优先使用服务端的加密套件
    ssl_prefer_server_ciphers on;

    # 推荐的加密套件（兼顾安全性和兼容性）
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # ECDH 曲线
    ssl_ecdh_curve X25519:secp384r1;

    # ========================================================================
    # SSL 性能优化
    # ========================================================================

    # SSL 会话缓存（减少 TLS 握手开销）
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 禁用 Session Tickets（安全考虑，除非有密钥轮转机制）
    ssl_session_tickets off;

    # ========================================================================
    # 安全响应头
    # ========================================================================

    # HSTS：强制浏览器使用 HTTPS（2 年有效期）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS 防护
    add_header X-XSS-Protection "1; mode=block" always;

    # ========================================================================
    # 反向代理到 Go 服务（HTTP 明文，SSL 终止在 Nginx）
    # ========================================================================
    location / {
        proxy_pass http://go_backend_https;

        # 传递客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 告诉 Go 服务原始协议是 HTTPS

        # HTTP/1.1 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 健康检查
    location /health {
        access_log off;
        proxy_pass http://go_backend_https/health;
    }

    # Let's Encrypt 证书续期验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
